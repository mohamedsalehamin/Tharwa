openapi: 3.1.0
info:
  title: Tharwa API
  version: 1.0.0
  description: >
    Backend for Tharwa (ثروة). Public read endpoints are unauthenticated for MVP market browsing.
    Admin routes are under /admin/v1 (separate security scheme). Parallel EGP is not in MVP.
servers:
  - url: https://api.example.com
    description: Production (replace with real host)
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
  - name: Contract
  - name: Market
  - name: Admin
  - name: Consumer

paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness and dependency checks
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/openapi.yaml:
    get:
      tags: [Contract]
      summary: Machine-readable API contract (YAML)
      description: Same OpenAPI document as the repository `contracts/openapi.yaml`; served for tooling and client generation.
      operationId: getOpenapiYaml
      responses:
        "200":
          description: OpenAPI 3.1 document
          content:
            application/yaml:
              schema:
                type: string
        "500":
          description: Spec file not found on server (misconfiguration)

  /v1/openapi.json:
    get:
      tags: [Contract]
      summary: Machine-readable API contract (JSON)
      description: YAML contract parsed to JSON for clients that prefer JSON OpenAPI.
      operationId: getOpenapiJson
      responses:
        "200":
          description: OpenAPI 3.1 document as JSON object
          content:
            application/json:
              schema:
                type: object
        "500":
          description: Spec file not found on server (misconfiguration)

  /v1/fx/rates:
    get:
      tags: [Market]
      summary: Official-category FX versus EGP
      operationId: listFxRates
      responses:
        "200":
          description: Current FX snapshot list
          content:
            application/json:
              schema:
                type: object
                required: [items, disclaimer]
                properties:
                  disclaimer:
                    type: string
                    description: Non-advisory disclaimer text key or literal for client display
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FxRateItem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/metals:
    get:
      tags: [Market]
      summary: Gold and silver reference prices in EGP
      operationId: listMetals
      responses:
        "200":
          description: Metals snapshot
          content:
            application/json:
              schema:
                type: object
                required: [items, disclaimer]
                properties:
                  disclaimer:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MetalItem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/market/summary:
    get:
      tags: [Market]
      summary: Compact home summary (subset of FX + metals + optional index placeholder)
      operationId: getMarketSummary
      responses:
        "200":
          description: Summary bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketSummary"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/stocks:
    get:
      tags: [Market]
      summary: Curated Egyptian equities list
      operationId: listStocks
      responses:
        "200":
          description: Curated list
          content:
            application/json:
              schema:
                type: object
                required: [items, disclaimer]
                properties:
                  disclaimer:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EquityListItem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/stocks/{symbol}:
    get:
      tags: [Market]
      summary: Equity detail headline fields
      operationId: getStockDetail
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: EGX:COMI
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquityDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/stocks/{symbol}/history:
    get:
      tags: [Market]
      summary: Historical candles for charting
      operationId: getStockHistory
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: range
          in: query
          schema:
            type: string
            enum: [1d, 1w, 1m, 1y]
            default: 1m
      responses:
        "200":
          description: OHLCV series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistorySeries"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/auth/register:
    post:
      tags: [Consumer]
      summary: Register consumer (password)
      operationId: consumerRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerRegisterRequest"
      responses:
        "201":
          description: Created + bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerAuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/social:
    post:
      tags: [Consumer]
      summary: Sign in or register with Google or Apple ID token
      operationId: consumerSocialLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerSocialLoginRequest"
      responses:
        "200":
          description: Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerAuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/login:
    post:
      tags: [Consumer]
      summary: Consumer password login
      operationId: consumerLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerLoginRequest"
      responses:
        "200":
          description: Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerAuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/forgot-password:
    post:
      tags: [Consumer]
      summary: Request password reset email
      operationId: consumerForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerForgotPasswordRequest"
      responses:
        "200":
          description: Generic success (does not reveal whether email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/reset-password:
    post:
      tags: [Consumer]
      summary: Set new password with reset token
      operationId: consumerResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerResetPasswordRequest"
      responses:
        "200":
          description: New password set; returns auth tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerAuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/verify-email:
    post:
      tags: [Consumer]
      summary: Verify email with token from registration email
      operationId: consumerVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerVerifyEmailRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified:
                    type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/announcements:
    get:
      tags: [Consumer]
      summary: List active in-app announcement banners
      operationId: listAnnouncements
      responses:
        "200":
          description: Active announcements for the current schedule window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementListResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/contact:
    post:
      tags: [Consumer]
      summary: Submit a contact-us message
      description: >
        Anonymous or signed-in users may submit feedback. Rate-limited per IP.
        When a valid consumer Bearer token is present, the submission is linked to the account.
      operationId: submitContact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactSubmissionRequest"
      responses:
        "201":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmissionCreatedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/account:
    delete:
      tags: [Consumer]
      summary: Permanently delete signed-in consumer account
      description: >
        Password reconfirmation when the account has a password. OAuth-only accounts
        may omit password. Deletes watchlist, trade journal, portfolio positions,
        practice/sim account, price alerts, refresh tokens, and other personal data.
        Push devices linked to the account are unlinked (not deleted).
      operationId: consumerDeleteAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerDeleteAccountRequest"
      responses:
        "204":
          description: Account deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/watchlist:
    get:
      tags: [Consumer]
      summary: List watchlist
      operationId: listWatchlist
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Watchlist items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Consumer]
      summary: Add instrument to watchlist
      operationId: addWatchlistItem
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistAddRequest"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: "#/components/schemas/WatchlistItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/watchlist/items/{id}:
    delete:
      tags: [Consumer]
      summary: Remove watchlist item
      operationId: deleteWatchlistItem
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/watchlist/reorder:
    patch:
      tags: [Consumer]
      summary: Reorder watchlist
      operationId: reorderWatchlist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchlistReorderRequest"
      responses:
        "200":
          description: Full ordered list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchlistListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/journal:
    get:
      tags: [Consumer]
      summary: List trade journal entries
      operationId: listJournal
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Journal lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Consumer]
      summary: Add journal entry
      operationId: createJournalEntry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/journal/{id}:
    patch:
      tags: [Consumer]
      summary: Update journal entry (note, price, executed date)
      operationId: patchJournalEntry
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalPatchRequest"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: "#/components/schemas/JournalEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Consumer]
      summary: Delete journal entry
      operationId: deleteJournalEntry
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/portfolio/summary:
    get:
      tags: [Consumer]
      summary: Portfolio summary from journal (self-reported)
      operationId: getPortfolioSummary
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Aggregated positions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/portfolio/positions/{instrumentId}:
    delete:
      tags: [Consumer]
      summary: Remove position (deletes all journal lines for instrument)
      operationId: deletePortfolioPosition
      security:
        - BearerAuth: []
      parameters:
        - name: instrumentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Position removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/zakat/nisab:
    get:
      tags: [Market]
      summary: Current nisab threshold from 21k gold gram price
      operationId: getZakatNisab
      responses:
        "200":
          description: Nisab snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZakatNisab"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/zakat/compute:
    post:
      tags: [Market]
      summary: Compute estimated zakat from asset inputs
      operationId: computeZakat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZakatComputeRequest"
      responses:
        "200":
          description: Zakat estimate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZakatComputeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/zakat/prefill:
    get:
      tags: [Consumer]
      summary: Prefill equity values from trade journal portfolio
      operationId: getZakatPrefill
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Journal-based prefill lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZakatPrefill"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/zakat/methodology:
    get:
      tags: [Market]
      summary: Zakat calculator methodology sections (AR/EN)
      operationId: getZakatMethodology
      responses:
        "200":
          description: Educational methodology content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZakatMethodology"

  /v1/zakat/sessions:
    get:
      tags: [Consumer]
      summary: List saved zakat calculation sessions
      operationId: listZakatSessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recent sessions (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ZakatSessionSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Consumer]
      summary: Save a zakat calculation session
      operationId: createZakatSession
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZakatSessionCreate"
      responses:
        "201":
          description: Saved session with fresh compute result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZakatSessionCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/zakat/sessions/{id}:
    get:
      tags: [Consumer]
      summary: Load a saved zakat session
      operationId: getZakatSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Session inputs and result snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZakatSessionDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Consumer]
      summary: Delete a saved zakat session
      operationId: deleteZakatSession
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/v1/auth/login:
    post:
      tags: [Admin]
      summary: Issue admin access JWT
      operationId: adminAuthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Bearer access token (HS256) for subsequent admin calls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/upstreams:
    get:
      tags: [Admin]
      summary: List upstream connector status (admin only)
      operationId: adminListUpstreams
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Upstream rows with health status, config, and secretRef (env key name only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUpstreamsList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Admin]
      summary: Create upstream connector (config JSON; secretRef is opaque KMS/env key name, not the secret value)
      operationId: adminCreateUpstream
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpstreamCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: "#/components/schemas/UpstreamStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/upstreams/{id}:
    patch:
      tags: [Admin]
      summary: Update upstream connector (enable/disable or rename)
      operationId: adminPatchUpstream
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpstreamPatch"
      responses:
        "200":
          description: Updated upstream status
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: "#/components/schemas/UpstreamStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Admin]
      summary: Delete upstream connector
      operationId: adminDeleteUpstream
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/v1/ops/invalidate-cache:
    post:
      tags: [Admin]
      summary: Invalidate Redis market cache keys (recovery after upstream fix)
      operationId: adminInvalidateMarketCache
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInvalidateCacheRequest"
      responses:
        "200":
          description: Keys deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInvalidateCacheResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/audit-logs:
    get:
      tags: [Admin]
      summary: List admin audit log entries (read-only, paginated)
      operationId: adminListAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: action
          in: query
          description: Substring match on action (case-insensitive)
          schema:
            type: string
