openapi: 3.1.0
info:
  title: Tharwa API — Masar Investor Profile (additive fragment)
  version: 1.2.0
  description: >
    ADDITIVE fragment for feature 003-masar-investor-profile. Paths and schemas here are
    merged into the canonical contract (specs/001-tharwa-platform-mvp/contracts/openapi.yaml).
    Quiz/result/illustration endpoints are PUBLIC (no auth, no stored PII). Profile endpoints
    require a signed-in consumer (BearerAuth). The benchmark endpoint is admin-only (AdminAuth).
    Everything is informational/educational: no brokerage, no order execution, no instruments
    named (asset-class level only), no guaranteed or forward returns, no personalized advice
    (constitution VI + spec Out of Scope).

# --- Paths (merge into existing `paths:`) ---
paths:
  /v1/masar/archetypes:
    get:
      tags: [Consumer]
      summary: Catalog of the 5 investor archetypes with default illustrative allocations
      operationId: listMasarArchetypes
      responses:
        "200":
          description: Archetype catalog (reference data; localized labels optional)
          content:
            application/json:
              schema:
                type: object
                required: [items, disclaimer]
                properties:
                  disclaimer:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Archetype"

  /v1/masar/result:
    post:
      tags: [Consumer]
      summary: Compute a (transient) archetype + default model from quiz answers
      description: Public and stateless — nothing is stored. Deterministic for a given answer set.
      operationId: computeMasarResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAnswers"
      responses:
        "200":
          description: Derived archetype + default illustrative model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasarResultView"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/masar/illustration:
    post:
      tags: [Consumer]
      summary: Backward-looking historical illustration of a model mix vs inflation, USD, gold
      description: >
        Public. Returns how the supplied asset-class mix would have tracked over the selected
        period versus EGP inflation, USD/EGP, and gold. Illustrative and backward-looking only —
        never a prediction, expected value, or guarantee.
      operationId: computeMasarIllustration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IllustrationInput"
      responses:
        "200":
          description: Historical illustration result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IllustrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/masar/profile:
    get:
      tags: [Consumer]
      summary: Get the signed-in consumer's saved Masar profile (or null)
      operationId: getMasarProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Saved profile, or null when none saved
          content:
            application/json:
              schema:
                type: object
                required: [profile]
                properties:
                  profile:
                    oneOf:
                      - $ref: "#/components/schemas/MasarProfile"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Consumer]
      summary: Save (overwrite) the consumer's Masar profile — keep latest only
      operationId: saveMasarProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasarProfileInput"
      responses:
        "200":
          description: Saved/overwritten profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasarProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Consumer]
      summary: Delete the consumer's saved Masar profile
      operationId: deleteMasarProfile
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Deleted (idempotent)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/v1/masar-benchmarks:
    get:
      tags: [Admin]
      summary: List Masar monthly benchmark points (most recent first)
      operationId: adminListMasarBenchmarks
      security:
        - AdminAuth: []
      responses:
        "200":
          description: Benchmark series
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MasarBenchmarkPoint"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Admin]
      summary: Upsert a Masar benchmark point for a month (audited)
      operationId: adminUpsertMasarBenchmark
      security:
        - AdminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MasarBenchmarkPointInput"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasarBenchmarkPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

# --- Components (merge into existing components.*) ---
components:
  schemas:
    ArchetypeId:
      type: string
      enum: [conservative, cautious_balanced, balanced, growth_balanced, aggressive_long_term]

    Allocation:
      type: object
      description: Asset-class-level only — no securities or funds. Sums to 100, 5% steps.
      required: [equityPct, fixedIncomePct, goldPct]
      properties:
        equityPct:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 5
        fixedIncomePct:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 5
        goldPct:
          type: integer
          minimum: 0
          maximum: 100
          multipleOf: 5

    Archetype:
      type: object
      required: [id, defaultAllocation]
      properties:
        id:
          $ref: "#/components/schemas/ArchetypeId"
        nameLabel:
          type: string
          description: Optional localized name for convenience; client may localize from id.
        descriptionLabel:
          type: string
          description: Optional localized educational description.
        defaultAllocation:
          $ref: "#/components/schemas/Allocation"

    QuizAnswers:
      type: object
      description: The fixed quiz answer set. All fields required to produce a result (FR-002).
      required: [goal, volatilityComfort, nearTermNeed, shariaPreferred]
      properties:
        goal:
          type: string
          enum: [grow_long_term, protect_income_short_term, not_sure]
        volatilityComfort:
          type: string
          enum: [comfortable, somewhat, uncomfortable]
        nearTermNeed:
          type: string
          enum: [yes, no, not_sure]
        shariaPreferred:
          type: boolean

    MasarResultView:
      type: object
      description: Transient result — not persisted by this endpoint.
      required: [archetype, defaultAllocation, shariaPreferred, disclaimer]
      properties:
        archetype:
          $ref: "#/components/schemas/ArchetypeId"
        nameLabel:
          type: string
        descriptionLabel:
          type: string
        defaultAllocation:
          $ref: "#/components/schemas/Allocation"
        shariaPreferred:
          type: boolean
        disclaimer:
          type: string
          description: Educational/illustrative/non-advisory copy for subtle display.

    IllustrationInput:
      type: object
      required: [allocation]
      properties:
        allocation:
          $ref: "#/components/schemas/Allocation"
        months:
          type: integer
          minimum: 1
          maximum: 120
          default: 60

    IllustrationBenchmark:
      type: object
      required: [key, outcome]
      properties:
        key:
          type: string
          enum: [inflation, usd, gold]
        benchmarkChangePct:
          type: number
          nullable: true
        realDeltaPct:
          type: number
          nullable: true
          description: Mix %Δ minus benchmark %Δ (positive = ahead).
        outcome:
          type: string
          enum: [ahead, behind, flat, unavailable]

    IllustrationResult:
      type: object
      required: [periodStart, periodEnd, hasSufficientData, disclaimer]
      properties:
        periodStart:
          type: string
          format: date
          nullable: true
        periodEnd:
          type: string
          format: date
          nullable: true
        mixChangePct:
          type: number
          nullable: true
          description: Backward-looking only — never a prediction or guarantee.
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/IllustrationBenchmark"
        sourceLabel:
          type: string
          nullable: true
        asOf:
          type: string
          format: date-time
          nullable: true
        hasSufficientData:
          type: boolean
          description: false when fewer than two benchmark months cover the period.
        disclaimer:
          type: string

    MasarProfileInput:
      type: object
      required: [archetype, allocation]
      properties:
        archetype:
          $ref: "#/components/schemas/ArchetypeId"
        allocation:
          $ref: "#/components/schemas/Allocation"
        shariaPreferred:
          type: boolean
          default: false
        answers:
          $ref: "#/components/schemas/QuizAnswers"

    MasarProfile:
      allOf:
        - $ref: "#/components/schemas/MasarProfileInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    MasarBenchmarkPointInput:
      type: object
      required: [periodMonth, sourceLabel]
      properties:
        periodMonth:
          type: string
          format: date
          description: First day of the month.
        equityIndex:
          type: number
          nullable: true
        fixedIncomeIndex:
          type: number
          nullable: true
        goldEgpPerGram:
          type: number
          nullable: true
        usdEgp:
          type: number
          nullable: true
        sourceLabel:
          type: string
        asOf:
          type: string
          format: date-time
          nullable: true

    MasarBenchmarkPoint:
      allOf:
        - $ref: "#/components/schemas/MasarBenchmarkPointInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
