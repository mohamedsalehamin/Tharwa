<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="refresh"
      content="0;url=https://apps.apple.com/app/%D8%AB%D8%B1%D9%88%D8%A9/id6773517765"
    />
    <link rel="canonical" href="https://apps.apple.com/app/%D8%AB%D8%B1%D9%88%D8%A9/id6773517765" />
    <title>حمّل ثروة — iOS</title>
    <meta name="robots" content="noindex" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        font-family: 'Cairo', system-ui, sans-serif;
        color: #fff;
        background: linear-gradient(180deg, #0a1a2f 0%, #0d1f38 100%);
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 24rem;
      }
      img {
        width: 4rem;
        height: 4rem;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
      }
      .brand {
        margin: 0 0 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #c9a227;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 2rem;
        color: #8a94a6;
        line-height: 1.6;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 20rem;
        padding: 1rem 1.5rem;
        border-radius: 0.75rem;
        background: #c9a227;
        color: #0a1a2f;
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
      }
      .hint {
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: #8a94a6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/social-templates/tharwa-logo.png" alt="" width="64" height="64" />
      <p class="brand">ثروة</p>
      <h1>حمّل التطبيق</h1>
      <p>أسعار الذهب والعملات والبورصة المصرية في تطبيق واحد.</p>
      <a class="button" href="https://apps.apple.com/app/%D8%AB%D8%B1%D9%88%D8%A9/id6773517765">حمّله من App Store</a>
      <p class="hint">جاري التحويل إلى App Store…</p>
    </div>
  </body>
</html>
