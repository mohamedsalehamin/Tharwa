        liabilitiesEgp:
          type: number
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/NetWorthCategorySubtotal"
        freshness:
          $ref: "#/components/schemas/Freshness"
        disclaimer:
          type: string

    NetWorthSnapshot:
      type: object
      required: [periodMonth, totalEgp]
      properties:
        periodMonth:
          type: string
          format: date
        capturedAt:
          type: string
          format: date-time
        totalEgp:
          type: number
        changeFromPrevPct:
          type: number
          nullable: true
        usdEgpRate:
          type: number
          nullable: true
        goldGramEgp:
          type: number
          nullable: true
        inflationIndex:
          type: number
          nullable: true

    Benchmark:
      type: object
      required: [key, outcome]
      properties:
        key:
          type: string
          enum: [inflation, usd, gold]
        benchmarkChangePct:
          type: number
          nullable: true
        realDeltaPct:
          type: number
          nullable: true
          description: Net worth %Δ minus benchmark %Δ (positive = ahead).
        outcome:
          type: string
          enum: [ahead, behind, flat, unavailable]

    RealReturnResult:
      type: object
      required: [periodStart, periodEnd, hasSufficientData, disclaimer]
      properties:
        periodStart:
          type: string
          format: date
          nullable: true
        periodEnd:
          type: string
          format: date
          nullable: true
        nominalChangePct:
          type: number
          nullable: true
        benchmarks:
          type: array
          items:
            $ref: "#/components/schemas/Benchmark"
        hasSufficientData:
          type: boolean
          description: false when fewer than two snapshots exist in the period.
        disclaimer:
          type: string

    GoalInput:
      type: object
      required: [label, targetAmountEgp, targetDate]
      properties:
        label:
          type: string
        targetAmountEgp:
          type: number
          exclusiveMinimum: 0
        targetDate:
          type: string
          format: date
        savedSource:
          type: string
          enum: [manual, net_worth, category]
          default: manual
        manualSavedEgp:
          type: number
          minimum: 0
          nullable: true
        savedCategory:
          type: string
          enum: [cash, certificate, real_estate, other_asset, loan, other_liability]
          nullable: true
        illustrativeAnnualRatePct:
          type: number
          nullable: true
          description: Optional. Drives an explicitly-labeled illustrative scenario only.

    IllustrativeScenario:
      type: object
      description: Illustrative only — not a prediction, expected value, or guarantee.
      required: [annualRatePct, projectedValueEgp, label]
      properties:
        annualRatePct:
          type: number
        projectedValueEgp:
          type: number
        label:
          type: string
          description: e.g. "Illustrative scenario — not a guarantee".

    Goal:
      allOf:
        - $ref: "#/components/schemas/GoalInput"
        - type: object
          required: [id, status, currentSavedEgp, progressPct, monthsRemaining, requiredMonthlyEgp, onTrack]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [active, achieved, past_due]
            currentSavedEgp:
              type: number
            progressPct:
              type: number
              description: 0..100 (capped at 100 when achieved).
            monthsRemaining:
              type: integer
            requiredMonthlyEgp:
              type: number
              description: No-assumed-return required monthly saving.
            onTrack:
              type: boolean
            illustrativeScenario:
              $ref: "#/components/schemas/IllustrativeScenario"
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    InflationBenchmarkInput:
      type: object
      required: [periodMonth, sourceLabel]
      properties:
        periodMonth:
          type: string
          format: date
          description: First day of the month.
        indexValue:
          type: number
          nullable: true
        yoyRatePct:
          type: number
          nullable: true
        sourceLabel:
          type: string
        asOf:
          type: string
          format: date-time
          nullable: true

    InflationBenchmark:
      allOf:
        - $ref: "#/components/schemas/InflationBenchmarkInput"
        - type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
