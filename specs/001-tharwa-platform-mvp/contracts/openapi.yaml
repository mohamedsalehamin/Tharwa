components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    AdminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ComponentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GoalId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    BadRequest:
      description: Validation or bad input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Unauthorized:
      description: Missing or invalid credentials / token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    ServiceUnavailable:
      description: Upstream unavailable and no acceptable cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    HealthResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, fail]

    QuoteMeta:
      type: object
      required: [asOf, quoteCategory, sessionState, isStale]
      properties:
        asOf:
          type: string
          format: date-time
        quoteCategory:
          type: string
          enum: [official, indicative, estimate]
        sessionState:
          type: string
          enum: [open, closed, pre, post, unknown]
        isStale:
          type: boolean

    FxRateItem:
      allOf:
        - $ref: "#/components/schemas/QuoteMeta"
        - type: object
          required: [baseCurrency, quoteCurrency, rate]
          properties:
            baseCurrency:
              type: string
              example: USD
            quoteCurrency:
              type: string
              example: EGP
            rate:
              type: number
              format: double
            changePct:
              type: number
              format: double
              nullable: true
            displayNameEn:
              type: string
              description: Consumer label from admin instruments (English)
            displayNameAr:
              type: string
              description: Consumer label from admin instruments (Arabic)
            flagUrl:
              type: string
              description: Admin-uploaded flag image (absolute URL or `/files/fx-flags/...`)

    MetalItem:
      allOf:
        - $ref: "#/components/schemas/QuoteMeta"
        - type: object
          required: [metal, unit, amountEgp]
          properties:
            metal:
              type: string
              enum: [gold, silver]
            unit:
              type: string
              enum: [gram, troy_ounce, gold_pound]
            karat:
              type: integer
              enum: [18, 21, 24]
              nullable: true
            amountEgp:
              type: number
              format: double
            flagUrl:
              type: string
              description: Admin-uploaded metal icon (gold or silver instrument)

    EquityListItem:
      allOf:
        - $ref: "#/components/schemas/QuoteMeta"
        - type: object
          required: [instrumentId, symbol, name]
          properties:
            instrumentId:
              type: string
              format: uuid
            symbol:
              type: string
            name:
              type: string
            nameAr:
              type: string
              description: Official display name in Arabic (curated instruments)
            last:
              type: number
              format: double
              nullable: true
            changePct:
              type: number
              format: double
              nullable: true

    EquityDetail:
      allOf:
        - $ref: "#/components/schemas/EquityListItem"
        - type: object
          properties:
            volume:
              type: integer
              format: int64
              nullable: true
            high:
              type: number
              format: double
              nullable: true
            low:
              type: number
              format: double
              nullable: true
            open:
              type: number
              format: double
              nullable: true
              description: Session reference open (daily bar) when available
            exchange:
              type: string
              example: EGX
            tvSymbol:
              type: string
              description: Upstream chart symbol identifier (non-secret)
            profile:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/EquityScannerProfile"
            relatedStocks:
              type: array
              items:
                $ref: "#/components/schemas/EquityRelatedStockRow"

    EquityScannerProfile:
      type: object
      description: TradingView Egypt scanner snapshot (indicative; may differ from official filings).
      properties:
        tickerName: { type: string }
        description: { type: string, nullable: true }
        close: { type: number, format: double, nullable: true }
        changePct: { type: number, format: double, nullable: true }
        volume: { type: integer, format: int64, nullable: true }
        marketCap: { type: number, format: double, nullable: true }
        dividendYield: { type: number, format: double, nullable: true }
        peTtm: { type: number, format: double, nullable: true }
        epsTtm: { type: number, format: double, nullable: true }
        revenueFyHistory:
          type: array
          items: { type: number, format: double }
          nullable: true
        sector: { type: string, nullable: true }
        industry: { type: string, nullable: true }
        floatShares: { type: integer, format: int64, nullable: true }
        sharesOutstanding: { type: integer, format: int64, nullable: true }
        beta1Y: { type: number, format: double, nullable: true }
        employees: { type: integer, nullable: true }
        isin: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        netIncomeFyHistory:
          type: array
          items: { type: number, format: double }
          nullable: true
        recommendAll:
          type: number
          format: double
          nullable: true
          description: Aggregate technical rating −1…1 (TradingView Recommend.All)
        recommendMovingAverages:
          type: number
          format: double
          nullable: true
          description: Moving-average aggregate (TradingView Recommend.MA)
        recommendOscillators:
          type: number
          format: double
          nullable: true
          description: Oscillator aggregate (TradingView Recommend.Other)

    EquityRelatedStockRow:
      type: object
      required: [symbol, name, close, changePct]
      properties:
        symbol: { type: string }
        name: { type: string }
        close: { type: number, format: double }
        changePct: { type: number, format: double }

    HistorySeries:
      type: object
      required: [symbol, resolution, points]
      properties:
        symbol:
          type: string
        resolution:
          type: string
          example: 1d
        points:
          type: array
          items:
            type: object
